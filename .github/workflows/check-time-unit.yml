name: Check Task Time Units

on: push
    
jobs:
  verify-HOUR:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remind collaborator & check for "HOUR"
        run: |
          echo "::warning::REMINDER: Please verify that all scheduled task durations are written in HOUR!"
          
          # Optional: Fails the check if the word "HOUR" is missing from your script
          if ! grep -qi "HOUR" *.md; then
            echo "::error::Alert! No reference to 'HOUR' found in your Python files. Please confirm your task time is in HOUR."
            exit 1
          fi
          
          echo "✅ 'HOUR' unit found in project files."
