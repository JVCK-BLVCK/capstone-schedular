name: Check Task Time Units
on: push

jobs:
  verify-HOUR:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject every variant except "Hour"
        run: |
          echo "::warning::REMINDER: All task durations must use the exact unit 'Hour' (capital H, singular)."
          failed=0
          for variant in hour hours Hours HOUR HOURS; do
            if grep -rnw -- "$variant" *.md; then
              echo "::error::Rejected time unit '$variant' found above. Use 'Hour' only."
              failed=1
            fi
          done
          exit "$failed"

      - name: Require "Hour" to be present
        run: |
          if ! grep -rqw 'Hour' -- *.md; then
            echo "::error::No 'Hour' unit found in any Markdown file."
            exit 1
          fi
          echo "✅ 'Hour' is used and no rejected variants were found."